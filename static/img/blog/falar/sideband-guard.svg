<svg xmlns="http://www.w3.org/2000/svg" width="980" height="600" viewBox="0 0 980 600" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar-gray" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/></marker>
    <marker id="ar-blue" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="ar-green" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,3 L0,6 Z" fill="#2f9e44"/></marker>
  </defs>
  <rect x="0" y="0" width="980" height="600" fill="#ffffff"/>
  <text x="490" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#1f2933">The server pays for a call it never hears</text>
  <text x="490" y="59" text-anchor="middle" font-size="13" fill="#66727f">Audio goes phone to OpenAI directly. The server sets the rules, watches the call from the side and keeps the clock.</text>

  <!-- phone -->
  <rect x="40" y="110" width="200" height="150" rx="14" fill="#fdf1f3" stroke="#d1495b" stroke-width="2"/>
  <text x="140" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Phone (Expo app)</text>
  <text x="140" y="158" text-anchor="middle" font-size="11" fill="#66727f">untrusted: an APK can be patched</text>
  <text x="140" y="190" text-anchor="middle" font-size="11" fill="#1f2933">microphone, speaker</text>
  <text x="140" y="208" text-anchor="middle" font-size="11" fill="#1f2933">WebRTC data channel</text>
  <text x="140" y="226" text-anchor="middle" font-size="11" fill="#1f2933">holds only an app token</text>

  <!-- openai -->
  <rect x="740" y="110" width="200" height="150" rx="14" fill="#eef2f7" stroke="#94a3b8" stroke-width="2"/>
  <text x="840" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">OpenAI Realtime</text>
  <text x="840" y="158" text-anchor="middle" font-size="11" fill="#66727f">one call, speech to speech</text>
  <text x="840" y="190" text-anchor="middle" font-size="11" fill="#1f2933">session config</text>
  <text x="840" y="208" text-anchor="middle" font-size="11" fill="#1f2933">conversation items</text>
  <text x="840" y="226" text-anchor="middle" font-size="11" fill="#1f2933">billed per token</text>

  <!-- server -->
  <rect x="330" y="330" width="320" height="200" rx="14" fill="#f8fafc" stroke="#334155" stroke-width="2.5"/>
  <text x="490" y="358" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2933">Django backend</text>
  <text x="490" y="378" text-anchor="middle" font-size="11" fill="#66727f">holds the API key</text>
  <rect x="352" y="394" width="130" height="52" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="417" y="416" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">Call broker</text>
  <text x="417" y="433" text-anchor="middle" font-size="10" fill="#66727f">config, budget check</text>
  <rect x="498" y="394" width="130" height="52" rx="8" fill="#e8f5ec" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="563" y="416" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2933">Guard</text>
  <text x="563" y="433" text-anchor="middle" font-size="10" fill="#66727f">one thread per call</text>
  <rect x="352" y="460" width="276" height="50" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="490" y="481" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2933">Budget by the server's clock</text>
  <text x="490" y="498" text-anchor="middle" font-size="10" fill="#66727f">started_at, call_ended_at; the app's duration is never used</text>

  <!-- audio path -->
  <line x1="242" y1="150" x2="736" y2="150" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
  <line x1="736" y1="170" x2="244" y2="170" stroke="#2563eb" stroke-width="3" marker-end="url(#ar-blue)"/>
  <text x="490" y="140" text-anchor="middle" font-size="12" font-weight="700" fill="#2563eb">audio and data channel, direct (WebRTC)</text>
  <text x="490" y="188" text-anchor="middle" font-size="11" fill="#66727f">the backend never sees this</text>

  <!-- sdp -->
  <line x1="130" y1="262" x2="356" y2="328" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="246" y="282" font-size="11" fill="#1f2933">1  SDP offer + app token</text>
  <line x1="340" y1="330" x2="114" y2="264" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#ar-gray)"/>
  <text x="60" y="312" font-size="11" fill="#1f2933">3  SDP answer only</text>

  <!-- create call -->
  <line x1="460" y1="328" x2="760" y2="264" stroke="#94a3b8" stroke-width="2" marker-end="url(#ar-gray)"/>
  <text x="468" y="290" font-size="11" fill="#1f2933">2  create call with the server's</text>
  <text x="468" y="305" font-size="11" fill="#1f2933">instructions and limits</text>

  <!-- sideband -->
  <line x1="600" y1="328" x2="846" y2="264" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar-green)"/>
  <line x1="896" y1="266" x2="640" y2="330" stroke="#2f9e44" stroke-width="3" marker-end="url(#ar-green)"/>
  <text x="700" y="345" font-size="11" font-weight="700" fill="#2f9e44">4  sideband WebSocket</text>
  <text x="700" y="361" font-size="11" fill="#1f2933">sees every event of the call,</text>
  <text x="700" y="376" font-size="11" fill="#1f2933">hangs up on rule breaks</text>

  <text x="490" y="570" text-anchor="middle" font-size="13" fill="#1f2933">The app can say anything on its data channel. The server cannot stop it from sending, only end the call when it does.</text>
</svg>
